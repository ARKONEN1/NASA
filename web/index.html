<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analog Atlas</title>
  <meta name="description" content="Find places on Earth that share conditions with Moon base and Mars landing sites, from open NASA data.">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true" class="logo"><circle cx="13" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="24" cy="9" r="4" fill="currentColor"/><path d="M4 22c6-2 12-2 18 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div>
        <h1 data-i18n="title">Analog Atlas</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="top-actions">
      <a class="method-link" href="#method" data-i18n="howLink">How it works</a>
      <div class="lang" role="radiogroup" aria-label="Language / Мова">
        <button role="radio" data-lang="en" aria-checked="true">EN</button>
        <button role="radio" data-lang="uk" aria-checked="false">УКР</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="controls">
      <section>
        <h2><span class="step">1</span> <span data-i18n="stepDest"></span></h2>
        <div class="segmented" role="radiogroup">
          <button role="radio" data-body="moon" aria-checked="true" data-i18n="moon"></button>
          <button role="radio" data-body="mars" aria-checked="false" data-i18n="mars"></button>
        </div>
      </section>
      <section>
        <h2><span class="step">2</span> <span id="site-h"></span></h2>
        <div class="site-map" id="site-map"></div>
        <ul class="targets" id="targets" role="listbox"></ul>
      </section>
      <section>
        <h2><span class="step">3</span> <span data-i18n="stepPurpose"></span></h2>
        <div class="purposes" id="purposes" role="radiogroup"></div>
        <p class="purpose-blurb" id="purpose-blurb"></p>
        <details class="weights">
          <summary data-i18n="fineTune"></summary>
          <div id="weights"></div>
        </details>
      </section>
    </aside>

    <section class="results">
      <section class="intro" id="intro" aria-labelledby="intro-h">
        <div class="intro-head">
          <h2 id="intro-h" data-i18n="introTitle"></h2>
          <button class="intro-hide" id="intro-hide" data-i18n="introHide"></button>
        </div>
        <ol class="intro-steps">
          <li data-i18n="intro1"></li>
          <li data-i18n="intro2"></li>
          <li data-i18n="intro3"></li>
        </ol>
      </section>

      <div class="map-wrap">
        <div id="map" data-i18n-aria="mapAria"></div>
        <div class="legend" aria-hidden="true">
          <span data-i18n="legendLow"></span><span class="ramp"></span><span data-i18n="legendHigh"></span>
        </div>
        <div class="map-toggles">
          <label><input type="checkbox" id="show-known" checked> <span class="known-pin sm"></span> <span data-i18n="knownToggle"></span></label>
          <label><input type="checkbox" id="show-caves"> <span class="cave-pin sm"></span> <span data-i18n="caveToggle"></span></label>
        </div>
        <div class="map-status" id="map-status" data-i18n="loading">Loading NASA data…</div>
      </div>

      <div class="panels">
        <section class="panel" aria-labelledby="top-h">
          <div class="panel-head">
            <h2 id="top-h" data-i18n="topTitle"></h2>
            <p class="hint" id="top-hint"></p>
          </div>
          <ol class="sites" id="sites"></ol>
          <div class="export">
            <span data-i18n="exportLabel"></span>
            <button id="export-csv">CSV</button>
            <button id="export-geojson">GeoJSON</button>
          </div>
        </section>

        <section class="panel compare" aria-labelledby="cmp-h" id="compare">
          <div class="panel-head">
            <h2 id="cmp-h" data-i18n="cmpTitle"></h2>
            <p class="hint" data-i18n="cmpHint"></p>
          </div>
          <div id="compare-body"></div>
        </section>
      </div>

      <section class="panel check" aria-labelledby="check-h">
        <div class="panel-head">
          <h2 id="check-h" data-i18n="checkTitle"></h2>
          <p class="hint" data-i18n="checkHint"></p>
        </div>
        <div id="check"></div>
      </section>

      <section class="panel method" id="method" aria-labelledby="method-h">
        <h2 id="method-h" data-i18n="methodTitle"></h2>
        <div class="method-grid">
          <div><h3 data-i18n="m1h"></h3><p data-i18n="m1p"></p></div>
          <div><h3 data-i18n="m2h"></h3><p data-i18n="m2p"></p></div>
          <div><h3 data-i18n="m3h"></h3><p data-i18n="m3p"></p></div>
          <div><h3 data-i18n="m4h"></h3><p data-i18n="m4p"></p></div>
        </div>
        <h3 data-i18n="dataTitle"></h3>
        <ul class="sources" id="sources"></ul>
        <p class="disclaimer" data-i18n="disclaimer"></p>
      </section>
    </section>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
